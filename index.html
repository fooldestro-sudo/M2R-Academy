<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="M2R-Academy — Learn. Practice. Master." />
  <title>M2R-Academy</title>
  <link rel="canonical" href="https://fooldestro-sudo.github.io/M2R-Academy/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="M2R-Academy" />
  <meta property="og:title" content="M2R-Academy — Learn. Practice. Master." />
  <meta property="og:description" content="M2R-Academy — Learn. Practice. Master." />
  <meta property="og:url" content="https://fooldestro-sudo.github.io/M2R-Academy/" />
  <meta property="og:image" content="https://fooldestro-sudo.github.io/M2R-Academy/assets/logo.svg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="M2R-Academy — Learn. Practice. Master." />
  <meta name="twitter:description" content="M2R-Academy — Learn. Practice. Master." />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body data-page="index">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <div class="container">
      <div id="announce" hidden></div>
      <section class="hero">
        <span class="hero__badge" data-i18n="hero.badge">badge</span>
        <h1 class="hero__title" data-i18n-html="hero.title">title</h1>
        <p class="hero__sub" data-i18n="hero.sub">sub</p>
        <div class="hero__cta">
          <a class="btn btn-primary" href="courses.html" data-i18n="hero.cta_courses">Start</a>
          <a class="btn btn-ghost" href="#how" data-i18n="hero.cta_how">How</a>
        </div>
      </section>

      <section class="section">
        <h2 class="section__title" data-i18n="what.t">What</h2>
        <p data-i18n="what.x">x</p>
      </section>

      <section class="section">
        <h2 class="section__title" data-i18n="target.t">Target</h2>
        <ul>
          <li data-i18n="target.1">1</li>
          <li data-i18n="target.2">2</li>
          <li data-i18n="target.3">3</li>
        </ul>
      </section>

      <section class="section">
        <h2 class="section__title" data-i18n="tracks.t">Tracks</h2>
        <p class="section__sub" data-i18n="tracks.sub">sub</p>
        <div class="grid grid--4" id="tracks-preview"></div>
      </section>

      <section class="section">
        <h2 class="section__title" data-i18n="projects.t">Projects</h2>
        <p class="section__sub" data-i18n="projects.sub">sub</p>
        <div class="grid grid--3" id="projects-preview"></div>
        <p><a class="btn btn-ghost" href="projects.html" data-i18n="projects.more">All</a></p>
      </section>

      <section class="section" id="lb-preview-sec" hidden>
        <h2 class="section__title" data-i18n="lb.t">Top</h2>
        <div style="overflow-x:auto"><table class="lb-table"><tbody id="lb-preview"></tbody></table></div>
        <p><a class="btn btn-ghost" href="leaderboard.html" data-i18n="lb.more">Full</a></p>
      </section>

      <section class="section" id="how">
        <h2 class="section__title" data-i18n="how.t">How</h2>
        <div class="steps">
          <div class="step"><span class="step__n">1</span><h3 class="step__title" data-i18n="how.1t">t</h3><p class="step__text" data-i18n="how.1x">x</p></div>
          <div class="step"><span class="step__n">2</span><h3 class="step__title" data-i18n="how.2t">t</h3><p class="step__text" data-i18n="how.2x">x</p></div>
          <div class="step"><span class="step__n">3</span><h3 class="step__title" data-i18n="how.3t">t</h3><p class="step__text" data-i18n="how.3x">x</p></div>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="assets/site.js"></script>
  <script src="assets/firebase.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    (function () {
      function lang() { return window.M2R.lang(); }
      function trackCount(t) {
        var n = 0;
        (t.parts || []).forEach(function (p) { n += (p.videos || []).length; });
        return n;
      }
      function thumbFor(t) {
        for (var i = 0; i < (t.parts || []).length; i++) {
          var v = (t.parts[i].videos || [])[0];
          if (v) return 'https://img.youtube.com/vi/' + v.youtubeId + '/maxresdefault.jpg';
        }
        return '';
      }
      function renderTracks() {
        window.M2R.loadJSON('data/courses.json').then(function (d) {
          var box = document.getElementById('tracks-preview');
          var L = lang();
          box.innerHTML = '';
          (d.tracks || []).forEach(function (t) {
            var soon = (t.parts || []).every(function (p) { return p.comingSoon; });
            var a = document.createElement('a');
            a.className = 'card';
            a.href = 'track.html?track=' + encodeURIComponent(t.id);
            var img = thumbFor(t);
            a.innerHTML =
              '<div class="card__media">' +
              (img ? '<img loading="lazy" alt="" src="' + window.M2R.esc(img) + '" onerror="this.remove()" />' : '<span>' + window.M2R.esc(t.icon) + '</span>') +
              '</div><div class="card__body">' +
              '<h3 class="card__title">' + window.M2R.esc(t.icon + ' ' + (L === 'en' ? (t.titleEn || t.title) : t.title)) + '</h3>' +
              '<p class="card__text">' + window.M2R.esc(L === 'en' ? (t.descriptionEn || t.description) : t.description) + '</p>' +
              '<div class="card__meta"><span class="chip">🎬 ' + trackCount(t) + '</span>' +
              (soon ? '<span class="chip chip--warning">' + window.M2R.esc(window.M2R.t('common.coming')) + '</span>' : '') + '</div>' +
              '<span style="color:var(--accent-hover);font-weight:600;font-size:.875rem">' + window.M2R.esc(window.M2R.t('common.view')) + '</span></div>';
            box.appendChild(a);
          });
        }).catch(function () {});
      }
      function renderProjects() {
        window.M2R.loadJSON('data/projects.json').then(function (d) {
          var box = document.getElementById('projects-preview');
          var L = lang();
          box.innerHTML = '';
          (d.projects || []).slice(0, 3).forEach(function (p) {
            var a = document.createElement('a');
            a.className = 'card';
            a.href = 'projects.html';
            a.innerHTML = '<div class="card__media">🎨</div><div class="card__body">' +
              '<h3 class="card__title">' + window.M2R.esc(L === 'en' ? (p.titleEn || p.title) : p.title) + '</h3>' +
              '<p class="card__text">' + window.M2R.esc(L === 'en' ? (p.descriptionEn || p.description) : p.description) + '</p></div>';
            box.appendChild(a);
          });
        }).catch(function () {});
      }
      function renderBoard() {
        window.M2RFirebase.ready().then(function (fb) {
          return fb.db.collection('users').orderBy('points', 'desc').limit(5).get();
        }).then(function (snap) {
          if (snap.empty) return;
          var tb = document.getElementById('lb-preview');
          var rank = 0, last = null;
          snap.forEach(function (doc, i) {
            var u = doc.data() || {};
            if (u.banned) return;
            if (u.points !== last) { rank = i + 1; last = u.points; }
            var tr = document.createElement('tr');
            tr.innerHTML = '<td>#' + rank + '</td><td>' +
              window.M2R.esc(u.displayName || u.email || '?') + '</td><td><strong>' +
              (u.points || 0) + '</strong></td>';
            tb.appendChild(tr);
          });
          if (tb.children.length) document.getElementById('lb-preview-sec').hidden = false;
        }).catch(function () {});
      }
      function renderAnnounce() {
        var show = function (txt) {
          if (!txt) return;
          var el = document.getElementById('announce');
          el.innerHTML = '<p class="quote">' + window.M2R.esc(txt) + '</p>';
          el.hidden = false;
        };
        window.M2RFirebase.ready().then(function (fb) {
          return fb.db.collection('settings').doc('main').get();
        }).then(function (s) {
          if (s.exists && s.data().announcement) show(s.data().announcement);
          else return window.M2R.loadJSON('data/settings.json').then(function (j) { show(j.announcement); });
        }).catch(function () {
          window.M2R.loadJSON('data/settings.json').then(function (j) { show(j.announcement); }).catch(function () {});
        });
      }
      function renderAll() {
        document.getElementById('tracks-preview').innerHTML = '';
        document.getElementById('projects-preview').innerHTML = '';
        document.getElementById('lb-preview').innerHTML = '';
        document.getElementById('lb-preview-sec').hidden = true;
        renderTracks(); renderProjects(); renderBoard(); renderAnnounce();
      }
      document.addEventListener('DOMContentLoaded', function () {
        renderAll();
        window.M2R.onLang(renderAll);
      });
    })();
  </script>
</body>
</html>
