<body data-page="leaderboard">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <div id="site-header"></div>

    <h1 data-i18n="lb.t">Top learners</h1>

    <div id="comp-banner"></div>
    <div id="lb-login-hint" hidden><p data-i18n="lb.login_hint">Log in to appear.</p></div>

        <tbody id="lb-body"></tbody>
      </table>
    </div>
    <p id="lb-empty" hidden data-i18n="lb.empty">No points yet.</p>
    <p class="form-error" id="lb-error" hidden></p>

  <div id="site-footer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
